[package]
name = "orbshacker"
version = "3.0.0"
edition = "2021"
authors = ["Mextrim"]
description = "100% Native Rust Discord Quests & Game Activity Companion"

[build-dependencies]
winres = "0.1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wry = "0.47"
tao = "0.30"
minreq = { version = "2.11", features = ["https"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
