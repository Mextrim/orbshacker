[package]
name = "orbshacker-launcher"
version = "2.15.0"
edition = "2021"
authors = ["Mextrim"]
description = "Native Windows lightweight launcher for orbshacker"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
minreq = { version = "3.0.0", features = ["https-rustls"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
