name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check-rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust Core & Launcher
        run: |
          cargo check --manifest-path src-rust/Cargo.toml
          cargo check --manifest-path src-launcher/Cargo.toml
