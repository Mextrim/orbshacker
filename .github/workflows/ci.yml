name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-rust:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust Application
        run: cargo check --manifest-path src-rust/Cargo.toml

      - name: Run Tests
        run: cargo test --manifest-path src-rust/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-rust/Cargo.toml -- -D warnings
