name: Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Rust Core & Launcher (Windows)
        run: |
          cargo build --release --manifest-path src-rust/Cargo.toml
          cargo build --release --manifest-path src-launcher/Cargo.toml
          mkdir -p src-gui/bin
          cp src-rust/target/release/orbshacker-core.exe src-gui/bin/orbshacker-core.exe

      - name: Install GUI dependencies
        run: |
          cd src-gui
          npm install

      - name: Build Electron App (Windows Portable & Archive)
        run: |
          cd src-gui
          npm run build:portable
          npm run build:win

      - name: Copy & Prepare Windows Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item src-launcher/target/release/orbshacker-launcher.exe artifacts/orbshacker-launcher.exe
          if (Test-Path dist/orbshacker-portable.exe) {
            Copy-Item dist/orbshacker-portable.exe artifacts/orbshacker.exe
          }
          Copy-Item src-rust/target/release/orbshacker-core.exe artifacts/orbshacker-core.exe
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or $tag -notmatch '^v\d') { $tag = "v2.6.0" }
          if (Test-Path dist/win-unpacked) {
            Compress-Archive -Path dist/win-unpacked/* -DestinationPath "artifacts/orbshacker-$tag-win-x64.zip" -Force
            Copy-Item "artifacts/orbshacker-$tag-win-x64.zip" artifacts/orbshacker-win-x64.zip
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: artifacts/*

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Build Launcher & Rust Core (Linux)
        run: |
          cargo build --release --manifest-path src-rust/Cargo.toml
          cargo build --release --manifest-path src-launcher/Cargo.toml
          mkdir -p src-gui/bin artifacts
          cp src-rust/target/release/orbshacker-core src-gui/bin/orbshacker-core
          chmod +x src-gui/bin/orbshacker-core
          cp src-launcher/target/release/orbshacker-launcher artifacts/orbshacker-launcher-linux-x64
          chmod +x artifacts/orbshacker-launcher-linux-x64

      - name: Install GUI dependencies
        run: |
          cd src-gui
          npm install

      - name: Build Electron App (Linux AppImage & tar.gz)
        run: |
          cd src-gui
          npm run build:linux

      - name: Prepare Linux Binaries
        run: |
          mkdir -p artifacts
          cp src-rust/target/release/orbshacker-core artifacts/orbshacker-core-linux-x64
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="v2.6.0"
          fi
          cp dist/*.AppImage artifacts/ || true
          cp dist/*.tar.gz artifacts/ || true
          for f in artifacts/*.tar.gz; do
            if [ -f "$f" ]; then
              cp "$f" "artifacts/orbshacker-${TAG}-linux-x64.tar.gz"
              cp "$f" "artifacts/orbshacker-linux-x64.tar.gz"
              break
            fi
          done
          for f in artifacts/*.AppImage; do
            if [ -f "$f" ]; then
              cp "$f" "artifacts/orbshacker-${TAG}-linux-x64.AppImage"
              cp "$f" "artifacts/orbshacker-linux-x64.AppImage"
              break
            fi
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: artifacts/*

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets

      - name: Flatten and generate SHA256SUMS
        run: |
          mkdir -p release-files
          find all-assets -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Determine Tag
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="v2.6.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Orbshacker ${{ steps.vars.outputs.tag }} - Windows & Linux
          body: |
            ## 🚀 Orbshacker ${{ steps.vars.outputs.tag }} (Windows + Linux)
            
            Multi-platform release of Orbshacker with Discord Quests & Badges Booster.
            
            ### 📥 Downloads & Launchers
            
            #### 🪟 Windows (x64)
            - **`orbshacker-launcher.exe`**: Ultra-lightweight native launcher (~1.8 MB). Automatically downloads and installs the latest version from GitHub and launches the app!
            - **`orbshacker.exe`**: Standalone single-file portable GUI app.
            - **`orbshacker-${{ steps.vars.outputs.tag }}-win-x64.zip`**: Full portable zip archive containing all runtime dependencies (ffmpeg, d3dcompiler, etc.).
            - **`orbshacker-core.exe`**: Native Rust CLI engine.
            
            #### 🐧 Linux (All Distros: Ubuntu, Debian, Arch, Fedora, openSUSE, etc.)
            - **`orbshacker-launcher-linux-x64`**: Native Linux launcher (~1.8 MB). Automatically downloads and prepares components.
            - **`orbshacker-${{ steps.vars.outputs.tag }}-linux-x64.AppImage`**: Standalone Linux AppImage.
            - **`orbshacker-${{ steps.vars.outputs.tag }}-linux-x64.tar.gz`**: Standalone tar.gz archive.
            - **`orbshacker-core-linux-x64`**: Native Linux CLI engine.
            
            ---
            
            ### ✨ What's New in ${{ steps.vars.outputs.tag }}
            - 📌 **Floating Mini-Widget Mode**: Ultra-compact glassmorphism overlay always-on-top with live countdown, progress bar, and instant pause.
            - 🌙 **Safe Auto-Shutdown Timer**: Automatically turns off PC when quests or playtime goals finish, with a 30s cancellation countdown.
            - 🏷️ **150+ Games Instant Category Filter**: Clean category chips for Top 2026, Shooters, RPG/Action, MOBA & Coop, Survival, and Simulators.
            - 🔔 **Zero-Footprint Web Audio Sound Engine**: 4 rich synthesized chimes (Tokyo Cyber, 8-Bit Retro, Zen Bell, Victory Fanfare) with sound test button.
            - 🚀 **Autostart with OS (Silent in Tray)**: Option to launch minimized to tray on Windows and Linux login.
            - 📋 **Telemetry Copy & Export**: Instant 1-click clipboard log copy and detailed JSON farm report export.
            - 🎮 **Discord Profile Badges Booster**: 150+ detectable games farmed in parallel with guaranteed Discord Heartbeat detection.
            - ⚡ **Zero-Download Game Spoofer**: Emulates games with real process handles and Steam manifests without downloading gigabytes.
            - 🎨 **Theme Engine & Glassmorphism UI**: 10 rich themes with minimalist clean layout.
            - 🔄 **Cross-Platform Auto-Updates**: In-app updater and lightweight native launcher for Windows and Linux.
          files: release-files/*
          draft: false
          prerelease: false
