name: Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Rust Core & Launcher (Windows)
        run: |
          cargo build --release --manifest-path src-rust/Cargo.toml
          cargo build --release --manifest-path src-launcher/Cargo.toml
          mkdir -p src-gui/bin
          cp src-rust/target/release/orbshacker-core.exe src-gui/bin/orbshacker-core.exe

      - name: Install GUI dependencies
        run: |
          cd src-gui
          npm install

      - name: Build Electron App (Windows Portable & Archive)
        run: |
          cd src-gui
          npm run build:portable
          npm run build:win

      - name: Copy & Prepare Windows Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item src-launcher/target/release/orbshacker-launcher.exe artifacts/orbshacker-launcher.exe
          if (Test-Path dist/orbshacker-portable.exe) {
            Copy-Item dist/orbshacker-portable.exe artifacts/orbshacker.exe
          }
          Copy-Item src-rust/target/release/orbshacker-core.exe artifacts/orbshacker-core.exe
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag -or $tag -notmatch '^v\d') { $tag = "v2.11.0" }
          if (Test-Path dist/win-unpacked) {
            Compress-Archive -Path dist/win-unpacked/* -DestinationPath "artifacts/orbshacker-$tag-win-x64.zip" -Force
            Copy-Item "artifacts/orbshacker-$tag-win-x64.zip" artifacts/orbshacker-win-x64.zip
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: artifacts/*

  publish-release:
    name: Publish Windows Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets

      - name: Flatten and generate SHA256SUMS
        run: |
          mkdir -p release-files
          find all-assets -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Determine Tag
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="v2.11.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Orbshacker ${{ steps.vars.outputs.tag }} - Windows (x64)
          body: |
            ## 🚀 Orbshacker ${{ steps.vars.outputs.tag }} - Native Windows (x64)
            
            Официальный нативный релиз Orbshacker для Windows (x64) с бустером квестов (Orbs), значков профиля Discord и автоматическим Discord Rich Presence (RPC).
            
            ### ✨ Что нового:
            - ⚡ **100% Native Windows Optimization**: полностью удалены лишние кроссплатформенные зависимости Linux, дистрибутив оптимизирован под архитектуру Windows (x64), размер пакета и лаунчера уменьшен.
            - 🔇 **100% бесшумный фоновый запуск игр (Zero Taskbar Spam)**: устранён спам миниатюрами и окнами на панели задач Windows. Процессы эмуляции запускаются полностью в фоне (`WS_EX_TOOLWINDOW | WS_EX_NOACTIVATE | CREATE_NO_WINDOW`), не появляются на панели задач и в Alt+Tab, не отвлекают пользователя и не воруют фокус, при этом на 100% корректно регистрируются в Discord.
            - 🎨 **15 премиальных тем оформления**: в палитру включены Bootstrap 5 UI, Flat Browser, Modern Tables (Slate), Apple Liquid Glass, Material You UI и другие с плавной прокруткой меню.
            - 🔮 **Автоматический Discord Rich Presence (RPC)**: программа напрямую транслирует в ваш профиль Discord текущее действие (квесты Orbs, 150+ игр для значков, фарм часов AFK, свою игру) с живым отсчётом времени через Application ID `1567134974031962272`.
            - ⚡ **Кнопка-индикатор RPC в шапке**: мгновенное отображение статуса вещания и возможность в один клик включить или выключить трансляцию.
            - 🔒 **Single-Instance Lock**: надёжная защита от запуска дублирующих процессов (в памяти гарантированно остаётся только один экземпляр).
            - 🔄 **Фоновый установщик обновлений без блокировок**: устранена ошибка `EBUSY` на Windows благодаря откреплённому скрипту обновления.
            - 📌 **Плавающий мини-виджет (Always-on-Top)**: компактная карточка 360×130 поверх всех окон с живым таймером и прогресс-баром.
            - 🌙 **Безопасное авто-выключение ПК**: таймер отключения компьютера по окончании фарма с возможностью отмены за 30 секунд.
            - 🏷️ **Интерактивные фильтры по 7 категориям**: мгновенный выбор среди 150+ игр (Топ 2026, Шутеры, RPG/Экшен, MOBA & Кооп, Выживание, Симуляторы).
            - 🔔 **Встроенный звуковой движок Web Audio**: 4 синтезированных звука без внешних файлов с тестом прямо в настройках.
            - 🚀 **Тихий автозапуск в трей**: опция автоматического фонового запуска при старте системы.
            - 📋 **Телеметрия в один клик**: быстрое копирование логов в буфер обмена и экспорт структурированного отчёта в JSON.
            
            ---
            
            ### 📥 Файлы для загрузки (Windows x64):
            - **`orbshacker-launcher.exe`**: Нативный ультралёгкий лаунчер (~1.5 МБ). Автоматически скачивает и распаковывает компоненты с GitHub.
            - **`orbshacker.exe`**: Портативная автономная версия программы (один файл).
            - **`orbshacker-${{ steps.vars.outputs.tag }}-win-x64.zip`**: Полный распакованный архив с библиотеками ffmpeg и runtime.
            - **`orbshacker-core.exe`**: Высокопроизводительное нативное Rust CLI ядро.
          files: release-files/*
          draft: false
          prerelease: false
          draft: false
          prerelease: false
